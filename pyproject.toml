[project]
name = "restaurant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sushil Chand", email = "sushilchand@Sushils-MacBook-Air.local" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "groq>=1.7.0",
    "langgraph>=1.2.12",
    "pre-commit>=4.6.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
restaurant = "restaurant.main:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
